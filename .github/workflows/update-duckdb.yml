# .github/workflows/update-duckdb.yml
name: Update DuckDB Version

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new DuckDB release
        id: check
        run: |
          LATEST=$(gh api repos/duckdb/duckdb/releases/latest --jq '.tag_name')
          CURRENT=$(grep -m1 'duckdb_version:' .github/workflows/MainDistributionPipeline.yml | awk '{print $2}')

          echo "latest=$LATEST current=$CURRENT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify ci-tools tag exists
        id: verify
        if: steps.check.outputs.updated == 'true'
        run: |
          NEW="${{ steps.check.outputs.latest }}"
          if ! gh api "repos/duckdb/extension-ci-tools/git/ref/tags/${NEW}" --silent 2>/dev/null; then
            echo "::warning::extension-ci-tools@${NEW} does not exist yet, skipping update"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version strings
        if: steps.check.outputs.updated == 'true' && steps.verify.outputs.skip != 'true'
        run: |
          OLD="${{ steps.check.outputs.current }}"
          NEW="${{ steps.check.outputs.latest }}"

          # Update all workflow files that pin DuckDB versions
          for f in .github/workflows/ExtensionTemplate.yml \
                   .github/workflows/MainDistributionPipeline.yml; do
            sed -i "s|duckdb_version: ${OLD}|duckdb_version: ${NEW}|g" "$f"
            sed -i "s|ci_tools_version: ${OLD}|ci_tools_version: ${NEW}|g" "$f"
            sed -i "s|extension-ci-tools/\\.github/workflows/_extension_distribution\\.yml@${OLD}|extension-ci-tools/.github/workflows/_extension_distribution.yml@${NEW}|g" "$f"
            sed -i "s|extension-ci-tools/\\.github/workflows/_extension_code_quality\\.yml@${OLD}|extension-ci-tools/.github/workflows/_extension_code_quality.yml@${NEW}|g" "$f"
          done

      - name: Create pull request
        if: steps.check.outputs.updated == 'true' && steps.verify.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Update DuckDB to ${{ steps.check.outputs.latest }}"
          body: "Automated update of DuckDB version from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}."
          branch: "update-duckdb-${{ steps.check.outputs.latest }}"
          commit-message: "Update DuckDB to ${{ steps.check.outputs.latest }}"
