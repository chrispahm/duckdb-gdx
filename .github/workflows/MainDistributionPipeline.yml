#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.3
    with:
      duckdb_version: v1.4.3
      ci_tools_version: v1.4.3
      extension_name: duckdb_gdx
      # linux_arm64: gcc-toolset-14 (GCC 14) on manylinux_2_28_aarch64 compiles
      #   against GCC 14's libstdc++ ABI but links against system GCC 8's libstdc++,
      #   causing undefined references. Upstream Docker image issue.
      # linux_amd64_musl: upstream Dockerfile has broken 'apk update --y' command.
      # windows_amd64_mingw: C++17 std::byte conflicts with rpcndr.h byte typedef
      #   in MinGW/rtools headers. _HAS_STD_BYTE=0 fix is MSVC-only.
      exclude_archs: 'linux_arm64;linux_amd64_musl;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.4.3
    with:
      duckdb_version: v1.4.3
      ci_tools_version: v1.4.3
      extension_name: duckdb_gdx
      format_checks: 'format;tidy'