name: Continuous Integration

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  cross-platform-build:
    name: Native builds & tests
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.0
    with:
      duckdb_version: v1.4.0
      ci_tools_version: v1.4.0
      extension_name: duckdb_gdx
      build_type: release
      upload_all_extensions: false

  wasm-glue-tests:
    name: WASM glue tests (Node.js)
    runs-on: ubuntu-latest
    needs: cross-platform-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: test/wasm
        run: npm install

      - name: Run WASM glue tests
        working-directory: test/wasm
        run: npm test
